# Single-page-app nginx config served from /usr/share/nginx/html.
# Listens on :8080 so the container can run as a non-root user in ACA.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache hashed assets (Vite emits content-hashed filenames).
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Never cache the entry HTML so a redeploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA fallback: any unknown path returns index.html so React Router
    # can resolve the route client-side.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Lightweight health endpoint for ACA probes.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
