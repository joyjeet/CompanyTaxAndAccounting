[project]
name = "ctaa"
version = "0.1.0"
description = "AI-assisted financial statement and tax preparation platform — deterministic accounting core."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.9",
    "cryptography>=43",
    "reportlab>=4.2",
    "openpyxl>=3.1",
    # PDF text extraction for inbound bank statements / invoices in the
    # demo/dev path (no Azure Doc Intelligence required).
    "pypdf>=5.0",
    # Azure SDKs — used in production wiring (Blob storage, Key Vault).
    # Kept in the base set so the API image ships with them; the integration
    # modules import them lazily so tests still run without Azure resources.
    "azure-identity>=1.19",
    "azure-storage-blob>=12.23",
    # Azure OpenAI client. Imported lazily by `AzureOpenAICategorizer` /
    # `AzureOpenAIClassifier` — tests and the in-process mock path never
    # touch the network.
    "openai>=1.50",
    # Azure AI Document Intelligence. Imported lazily by
    # `AzureDocumentIntelligenceExtractor` — tests and the in-process mock
    # path never touch the network.
    "azure-ai-documentintelligence>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008: function call in argument defaults — FastAPI's Depends/File/Form/Query
# conventions REQUIRE this. The framework's whole DI model is built around it.
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
