name: Isolation Gate Proof

# Runs once per week and on-demand. It deliberately introduces a known
# tenant-isolation bypass and PROVES that the test suite catches it.
#
# This workflow MUST exit with success when the patched test suite FAILS.
# That is the evidence the SOC 2 auditor wants: the gate is real.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1'   # Mondays 07:00 UTC

jobs:
  prove-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_AUTH_MODE: test
      APP_KEK_PROVIDER: local
      APP_LOCAL_KEK_MASTER_SECRET: "ci-test-master-secret-not-for-prod-use-only-32b"
      APP_JWT_SECRET: "ci-jwt-secret-not-for-prod"
      DATABASE_OWNER_URL: "postgresql+psycopg://ctaa_owner_test:owner_test@localhost:5432/ctaa_test"
      DATABASE_URL: "postgresql+psycopg://app_user_test:app_user_test@localhost:5432/ctaa_test"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Bootstrap Postgres roles
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres <<'SQL'
          CREATE ROLE ctaa_owner_test LOGIN PASSWORD 'owner_test' CREATEDB;
          CREATE ROLE app_user_test LOGIN PASSWORD 'app_user_test';
          CREATE DATABASE ctaa_test OWNER ctaa_owner_test;
          GRANT CONNECT ON DATABASE ctaa_test TO app_user_test;
          SQL
          PGPASSWORD=owner_test psql -h localhost -U ctaa_owner_test -d ctaa_test <<'SQL'
          GRANT USAGE ON SCHEMA public TO app_user_test;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO app_user_test;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO app_user_test;
          SQL

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run migrations
        run: alembic upgrade head

      - name: Baseline tests (must pass)
        run: pytest -q tests/security tests/integration

      - name: Inject deliberate isolation bypass
        run: |
          python scripts/inject_isolation_bypass.py

      - name: Patched tests MUST fail (this is success)
        id: patched
        continue-on-error: true
        run: pytest -q tests/security tests/integration

      - name: Verify the gate caught the bypass
        run: |
          if [ "${{ steps.patched.outcome }}" = "failure" ]; then
            echo "::notice::Isolation gate caught the deliberate bypass — gate is REAL."
            exit 0
          else
            echo "::error::ISOLATION GATE FAILED — patched tests PASSED. RLS regression let through!"
            exit 1
          fi
