name: Quality Gate

# The single source of truth for "is this code safe to ship".
#
# Called by `ci.yml` (pull requests) and by `cd.yml` (before anything is
# built or deployed). Keeping it in one reusable workflow means the gate a
# reviewer sees on a PR is byte-for-byte the gate a deployment has to pass —
# there is no second, weaker path to production.

on:
  workflow_call:
    outputs:
      passed:
        description: 'true when lint, migrations and the full test suite all passed'
        value: ${{ jobs.test.outputs.passed }}

jobs:
  test:
    name: Lint, migrate, test
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.result.outputs.passed }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_AUTH_MODE: test
      APP_KEK_PROVIDER: local
      APP_LOCAL_KEK_MASTER_SECRET: "ci-test-master-secret-not-for-prod-use-only-32b"
      APP_JWT_SECRET: "ci-jwt-secret-not-for-prod"
      DATABASE_OWNER_URL: "postgresql+psycopg://ctaa_owner_test:owner_test@localhost:5432/ctaa_test"
      DATABASE_URL: "postgresql+psycopg://app_user_test:app_user_test@localhost:5432/ctaa_test"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Bootstrap Postgres roles & RLS
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres <<'SQL'
          CREATE ROLE ctaa_owner_test LOGIN PASSWORD 'owner_test' CREATEDB;
          CREATE ROLE app_user_test LOGIN PASSWORD 'app_user_test';
          CREATE DATABASE ctaa_test OWNER ctaa_owner_test;
          GRANT CONNECT ON DATABASE ctaa_test TO app_user_test;
          SQL
          PGPASSWORD=owner_test psql -h localhost -U ctaa_owner_test -d ctaa_test <<'SQL'
          GRANT USAGE ON SCHEMA public TO app_user_test;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO app_user_test;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO app_user_test;
          SQL

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Run migrations
        run: alembic upgrade head

      # Every migration must be reversible. A forward-only migration means a
      # bad deploy cannot be rolled back, which for tenant data is not an
      # acceptable failure mode.
      - name: Verify the newest migration round-trips
        run: |
          alembic downgrade -1
          alembic upgrade head

      - name: Run tests
        run: |
          pytest -q \
            --junitxml=results/ci/junit.xml \
            --cov=app \
            --cov-report=xml:results/ci/coverage.xml \
            --cov-report=term-missing:skip-covered

      # Renders the pass/fail breakdown into the Actions run page so the
      # result is readable without downloading anything.
      - name: Publish test summary
        if: always()
        run: python scripts/ci_test_summary.py results/ci/junit.xml results/ci/coverage.xml

      # Retained as audit evidence: which tests ran, on which commit, when.
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-${{ github.sha }}
          path: results/ci/
          retention-days: 90

      - name: Dependency audit
        run: pip-audit --strict || echo "pip-audit reported issues — see log"

      - id: result
        run: echo "passed=true" >> "$GITHUB_OUTPUT"

  frontend:
    name: Frontend typecheck, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx vitest run --reporter=default --reporter=junit --outputFile=../results/ci/frontend-junit.xml
      - name: Build
        run: npm run build
      - name: Upload frontend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-evidence-${{ github.sha }}
          path: results/ci/
          retention-days: 90
