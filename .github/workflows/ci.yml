name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      APP_AUTH_MODE: test
      APP_KEK_PROVIDER: local
      APP_LOCAL_KEK_MASTER_SECRET: "ci-test-master-secret-not-for-prod-use-only-32b"
      APP_JWT_SECRET: "ci-jwt-secret-not-for-prod"
      APP_DATABASE_URL: "postgresql+psycopg://ctaa_owner_test:owner_test@localhost:5432/ctaa_test"
      APP_DATABASE_URL_APP: "postgresql+psycopg://app_user_test:app_user_test@localhost:5432/ctaa_test"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pyproject.toml

      - name: Bootstrap Postgres roles & RLS
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres <<'SQL'
          CREATE ROLE ctaa_owner_test LOGIN PASSWORD 'owner_test' CREATEDB;
          CREATE ROLE app_user_test LOGIN PASSWORD 'app_user_test';
          CREATE DATABASE ctaa_test OWNER ctaa_owner_test;
          GRANT CONNECT ON DATABASE ctaa_test TO app_user_test;
          SQL
          PGPASSWORD=owner_test psql -h localhost -U ctaa_owner_test -d ctaa_test <<'SQL'
          GRANT USAGE ON SCHEMA public TO app_user_test;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO app_user_test;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT USAGE, SELECT ON SEQUENCES TO app_user_test;
          SQL

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pip-audit

      - name: Lint (ruff)
        run: ruff check app tests

      - name: Run migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q

      - name: Dependency audit
        run: pip-audit --strict || echo "pip-audit reported issues — see log"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: ctaa-api:${{ github.sha }}
          load: true
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ctaa-api:${{ github.sha }}
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
