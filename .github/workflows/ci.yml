name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  # Same gate the deploy pipeline has to pass — see .github/workflows/tests.yml.
  quality-gate:
    uses: ./.github/workflows/tests.yml

  docker:
    runs-on: ubuntu-latest
    needs: quality-gate
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: ctaa-api:${{ github.sha }}
          load: true
      - name: Trivy filesystem scan
        # Pinned to a commit SHA: floating tags on third-party actions are a
        # supply-chain risk, and 0.28.0 was deleted upstream which broke this job.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ctaa-api:${{ github.sha }}
          ignore-unfixed: true
          severity: 'HIGH,CRITICAL'
          exit-code: '0'
